name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Test subtitle timing and project parsing
      run: python -m unittest -v

    - name: Build Executable with PyInstaller
      run: pyinstaller --noconfirm --onedir --windowed --name "CapCutSubTool" --collect-all customtkinter --collect-all darkdetect --copy-metadata faster_whisper --copy-metadata ctranslate2 --copy-metadata huggingface_hub --copy-metadata tokenizers capcut_sub_tool.py

    - name: Download and Bundle FFmpeg
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
        Copy-Item "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "dist\CapCutSubTool\ffmpeg.exe"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CapCutSubTool-App
        path: dist/CapCutSubTool
